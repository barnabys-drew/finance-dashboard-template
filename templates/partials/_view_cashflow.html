  <!-- Cash Flow Tab -->
  <div id="view-cashflow" style="display:none">

  <!-- Empty / unavailable state -->
  <div id="cashflow-empty" class="card-panel p-4 mb-6" style="display:none;color:#8b949e;font-size:0.85rem"></div>

  <div id="cashflow-content" style="display:none">

    <!-- Stat cards -->
    <div class="grid grid-cols-12 gap-4 mb-6">
      <div class="col-span-6 sm:col-span-3">
        <div class="card-panel stat-card">
          <div class="stat-value" id="cf-stat-balance">—</div>
          <div class="stat-label">Checking balance today</div>
        </div>
      </div>
      <div class="col-span-6 sm:col-span-3">
        <div class="card-panel stat-card">
          <div class="stat-value" id="cf-stat-min">—</div>
          <div class="stat-label" id="cf-stat-min-label">Minimum projected</div>
        </div>
      </div>
      <div class="col-span-6 sm:col-span-3">
        <div class="card-panel stat-card">
          <div class="stat-value" id="cf-stat-safe">—</div>
          <div class="stat-label" id="cf-stat-safe-label">Safe to move to savings</div>
        </div>
      </div>
      <div class="col-span-6 sm:col-span-3">
        <div class="card-panel stat-card">
          <div class="stat-value" id="cf-stat-bills">—</div>
          <div class="stat-label">Upcoming bills in horizon</div>
        </div>
      </div>
    </div>

    <!-- Projection chart -->
    <div class="card-panel p-4 mb-6">
      <div class="flex justify-between items-center mb-2">
        <div class="section-title mb-0" id="cashflow-chart-title">Projected Checking Balance</div>
        <div style="font-size:0.72rem;color:#6e7681">Green dots = paydays · red dots = bills</div>
      </div>
      <canvas id="cashflow-chart" style="max-height:300px"></canvas>
    </div>

    <!-- Upcoming bills -->
    <div class="card-panel p-4 mb-6">
      <div class="section-title" id="cashflow-bills-title">Upcoming Bills</div>
      <div id="cashflow-bills-empty" style="display:none;color:#8b949e;font-size:0.8rem">No recurring bills due in this window.</div>
      <table class="w-full" style="font-size:0.82rem">
        <tbody id="cashflow-bills-body"></tbody>
      </table>
    </div>

    <!-- Assumptions -->
    <div id="cashflow-assumptions" style="font-size:0.72rem;color:#6e7681;margin-bottom:24px"></div>

  </div>
  </div>
